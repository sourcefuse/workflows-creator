<div class="tree-node">
  <span
    class="action-icons icon-workflow-plus"
    *ngIf="isLast()"
    (click)="addClick($event)"
  ></span>
  <span
    class="action-icons icon-workflow-delete"
    (click)="removeClick()"
  ></span>

  <div class="workflow-content">
    <span *ngIf="!isFirst()"> and </span>
    {{ node()?.node?.statement || '' }}

    <ng-container
      *ngTemplateOutlet="inputTemplate(); context: {node: node()}"
    ></ng-container>
  </div>
</div>
