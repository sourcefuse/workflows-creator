    <!-- Critical fix for zone.js hasOwnProperty error - MUST run before workflows-element.js -->
    <script>
      (function () {
        'use strict';

        // Store original functions
        const originalGetPrototypeOf = Object.getPrototypeOf;
        const originalHasOwnProperty = Object.prototype.hasOwnProperty;
        const patchedObjects = new WeakSet();

        // Comprehensive fix: ensure ALL objects have hasOwnProperty
        function ensureHasOwnProperty(obj) {
          if (!obj || patchedObjects.has(obj)) {
            return obj;
          }

          try {
            // If the object doesn't have hasOwnProperty or it's not a function
            const descriptor = Object.getOwnPropertyDescriptor(
              obj,
              'hasOwnProperty',
            );
            if (!descriptor || typeof obj.hasOwnProperty !== 'function') {
              Object.defineProperty(obj, 'hasOwnProperty', {
                value: function (prop) {
                  return originalHasOwnProperty.call(this, prop);
                },
                writable: true,
                configurable: true,
                enumerable: false,
              });
            }
            patchedObjects.add(obj);
          } catch (e) {
            // Ignore sealed/frozen objects
          }

          return obj;
        }

        // Override Object.getPrototypeOf to patch prototypes as they're accessed
        Object.getPrototypeOf = function (obj) {
          const proto = originalGetPrototypeOf(obj);
          if (proto) {
            ensureHasOwnProperty(proto);
          }
          return proto;
        };

        // Preemptively patch all built-in prototypes
        const builtIns = [
          Object,
          Array,
          Function,
          String,
          Number,
          Boolean,
          Date,
          RegExp,
          Error,
          Map,
          Set,
          WeakMap,
          WeakSet,
          Promise,
          Int8Array,
          Uint8Array,
          Uint8ClampedArray,
          Int16Array,
          Uint16Array,
          Int32Array,
          Uint32Array,
          Float32Array,
          Float64Array,
        ];

        builtIns.forEach(function (BuiltIn) {
          try {
            if (BuiltIn && BuiltIn.prototype) {
              ensureHasOwnProperty(BuiltIn.prototype);
            }
          } catch (e) {
            // Ignore
          }
        });

        // Also patch window/global prototype chain
        try {
          let current = window;
          while (current) {
            ensureHasOwnProperty(current);
            current = originalGetPrototypeOf(current);
          }
        } catch (e) {
          // Ignore
        }

        console.log('Zone.js hasOwnProperty fix applied');
      })();
    </script>

    <script type="text/javascript" src="workflows-element.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Wait for the custom element to be defined
        await customElements.whenDefined('sourceloop-workflow-element');

        // Create the element
        const element = document.createElement('sourceloop-workflow-element');

        // Get the container
        const container = document.getElementById('workflow-container');

        const NORMALIZED_COLUMN = [
          {
            text: 'Status',
            value: '1952177d-9a3e-6ef4-ae8f-522c08153026',
          },
          {
            text: 'Priority',
            value: '1952177d-9a3e-6ef4-ae8f-522c08153026',
          },
          {
            text: 'Text',
            value: '2069d144-db46-0737-2c9d-bc339949d684',
          },
          {
            text: 'Number',
            value: '47beeecd-712c-6f8b-c595-92c3712780cb',
          },
        ];

        const TIMESCALE = [
          {text: 'Days', value: 'D', timescale: ''},
          {text: 'Hours', value: 'H', timescale: 'T'},
          {text: 'Seconds', value: 'S', timescale: 'T'},
        ];

        const EMAIL_RECIPIENTS = [
          {text: 'Me', value: 'me'},
          {text: 'Everyone on project', value: 'everyone'},
          {text: 'Project owners', value: 'owners'},
          {text: 'Specific people', value: 'specific'},
        ];

        const VALUE_TYPES = [
          {
            text: 'ANYTHING',
            value: 'anyValue',
          },
          {
            text: 'CUSTOM_VALUE',
            value: 'customValue',
          },
        ];

        const FIELD_VALUES = {
          status: {
            valueInputType: 'list',
            values: [
              {text: 'Todo', value: 'todo'},
              {text: 'In Progress', value: 'in_progress'},
            ],
          },
          priority: {
            valueInputType: 'list',
            values: [
              {text: 'Critical', value: 'critical'},
              {text: 'High', value: 'high'},
              {text: 'Medium', value: 'medium'},
              {text: 'Low', value: 'low'},
            ],
          },
          date: {
            valueInputType: 'date',
          },
          datetime: {
            valueInputType: 'datetime',
          },
          people: {
            valueInputType: 'people',
          },
          text: {
            valueInputType: 'text',
          },
          number: {
            valueInputType: 'number',
          },
        };

        const DEFAULT_CONDITION = [
          {text: 'Equal', value: 'equal'},
          {text: 'Not Equal', value: 'notequal'},
        ];
        const DATE_CONDITIONS = [
          {text: 'Past Today', value: 'pastToday'},
          {text: 'Coming In', value: 'comingIn'},
          {text: 'Past by', value: 'pastby'},
        ];
        const CONDITIONS = {
          date: DATE_CONDITIONS,
          datetime: DATE_CONDITIONS,
        };

        let selectedCol;
        let selectedColumnType;
        const gatewayType = new Map();
        // prepareGatewayTypeForAvailableConditions();
        let gatewayTypeCol = [];
        let diagram = '';

        // Initialize localization map - matching Angular sandbox structure
        const localeMap = {
          whenThisHappensLbl: 'When This Happens',
          doThisLbl: 'Do This',
          columnChangesLbl: 'Column Changes',
          onIntervalLbl: 'On Interval',
          onAddItemLbl: 'On Add Item',
          itemCreatedLbl: 'Item Created',
          checkValueLbl: 'Check Value',
          changeValueLbl: 'Change Value',
          sendAnEmailLbl: 'Send An Email',
          elseLbl: 'else',
          typeSubjectLbl: 'Type Subject',
          typeEmailLbl: 'Type Email',
          selectColumnTooltip: 'Select Column Tooltip',
          setLbl: 'Set',
        };

        element.localizedStringMap = localeMap;
        element.state = {
          columns: NORMALIZED_COLUMN,
          conditions: [],
          values: [],
        };
        element.allColumns = [
          {
            text: 'Status',
            value: '{{Status}}',
          },
          {
            text: 'People',
            value: '{{People}}',
          },
          {
            text: 'Text',
            value: '{{Text}}',
          },
          {
            text: 'Number',
            value: '{{Number}}',
          },
          {
            text: 'Date/Time',
            value: '{{Date/Time}}',
          },
          {
            text: 'Date',
            value: '{{Date}}',
          },
          {
            text: 'Assignee',
            value: '{{Assignee}}',
          },
        ];

        console.log('Setting localizedStringMap:', localeMap);
        console.log('Element before setting properties:', element);
        console.log('Element tagName:', element.tagName);

        // Set properties on the element
        element.localizedStringMap = localeMap;
        element.state = {
          columns: NORMALIZED_COLUMN,
          conditions: [],
          values: [],
        };
        element.allColumns = [
          {
            text: 'Status',
            value: '{{Status}}',
          },
          {
            text: 'People',
            value: '{{People}}',
          },
          {
            text: 'Text',
            value: '{{Text}}',
          },
          {
            text: 'Number',
            value: '{{Number}}',
          },
          {
            text: 'Date/Time',
            value: '{{Date/Time}}',
          },
          {
            text: 'Date',
            value: '{{Date}}',
          },
          {
            text: 'Assignee',
            value: '{{Assignee}}',
          },
        ];

        console.log(
          'LocalizedStringMap after setting:',
          element.localizedStringMap,
        );

        // Now append the element to the DOM with all properties set
        container.appendChild(element);

        element.addEventListener('diagramChange', event => {
          diagram = event.detail;
          const element = document.getElementById('diagram');
          if (diagram) {
            element.innerText = diagram;
          }
        });
        element.addEventListener('eventAdded', event => {
          elementClick(event.detail);
        });
        element.addEventListener('actionAdded', event => {
          elementClick(event.detail);
        });
        element.addEventListener('itemChanged', event => {
          valueChanges(event.detail);
        });

        function elementClick(event) {
          const selectedElement = event.event ?? event.action;
          switch (selectedElement.getIdentifier()) {
            case window.OnIntervalEvent.identifier:
              selectedElement.state.change('intervalList', TIMESCALE);
              selectedElement.state.change('valuePlaceholder', 'n');
            case window.OnChangeEvent.identifier:
            case window.OnValueEvent.identifier:
              let columns = NORMALIZED_COLUMN.filter(
                col => col.text.toLowerCase() !== 'priority',
              );
              selectedElement.state.change('columns', columns);
              break;
            case window.ChangeColumnValueAction.identifier:
              selectedElement.state.change('columns', NORMALIZED_COLUMN);
              break;
            case window.SendEmailAction.identifier:
              selectedElement.state.change('emailToInputType', 'list');
              selectedElement.state.change('emailToValues', EMAIL_RECIPIENTS);
              break;
          }
        }

        function valueChanges(event) {
          let selectedCol;

          switch (event.field) {
            case window.ValueInput.identifier:
              if (
                event.item.getIdentifier() === window.OnIntervalEvent.identifier
              ) {
                event.item.state.change('intervalList', TIMESCALE);
                return;
              }
              break;
            case window.IntervalInput.identifier:
              const timescale = TIMESCALE.find(
                // brekets
                time => time.value === event.value,
              )?.timescale;
              event.item.state.change('timescale', timescale);
              break;
            case window.TriggerColumnInput.identifier:

            case window.ColumnInput.identifier:
              selectedCol = NORMALIZED_COLUMN.find(
                col => col.value === event.value,
              );
              selectedColumnType = selectedCol.text?.toLowerCase();
              const condition =
                CONDITIONS[selectedCol.text?.toLowerCase()] ||
                DEFAULT_CONDITION;
              if (selectedCol) {
                event.item.state.change('conditions', condition);
              }
            case window.ConditionInput.identifier:
            case window.ToColumnInput.identifier:
              selectedCol = NORMALIZED_COLUMN.find(
                col => col.value === event.value,
              );
              if (selectedCol)
                selectedColumnType = selectedCol.text?.toLowerCase();
              event.item.state.change(
                'valueInputType',
                FIELD_VALUES[selectedColumnType].valueInputType,
              );
              if (FIELD_VALUES[selectedColumnType].values) {
                event.item.state.change(
                  'values',
                  FIELD_VALUES[selectedColumnType].values,
                );
              }

              break;
            case window.EmailDataInput.identifier:
          }
        }
      });
    </script>
